[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-coach"
version = "0.1.0"
description = "Offline-first CLI that assesses interview knowledge, plans a 7-day study week, and replans from completion."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hds26" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["openai>=1.40"]

[project.scripts]
interview-coach = "interview_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
